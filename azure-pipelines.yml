trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
  inputs:
    terraformVersion: '1.9.0'

- script: |
    cd tf/test_terraform
    terraform init -input=false 
    terraform plan -input=false -out output.tfplan
    pwd
    ls
    echo "defaultwd $(System.DefaultWorkingDirectory)" 
  displayName: 'Terraform plan'

- task: TerraformOutput@1
  inputs:
    outputFilePath: '$(System.DefaultWorkingDirectory)/tf/test_terraform/output.tfplan'
    artifactName: 'test_terraform'

- script: |
    # Download the installer script:
    curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh
    # Alternatively: wget --secure-protocol=TLSv1_2 --https-only https://get.opentofu.org/install-opentofu.sh -O install-opentofu.sh
    chmod +x install-opentofu.sh
    ./install-opentofu.sh --install-method deb
    cd tf/test_tofu
    tofu init -input=false 
    tofu plan -input=false -out output.tfplan
    pwd
    ls
    echo "defaultwd $(System.DefaultWorkingDirectory)" 
  displayName: 'Tofu Plan'

- task: TerraformOutput@1
  inputs:
    terraformTool: 'tofu'
    outputFilePath: '$(System.DefaultWorkingDirectory)/tf/test_tofu/output.tfplan'
    artifactName: 'test_tofu'